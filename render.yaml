services:
  - type: web
    name: sma-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    initialDeployHook: python -m app.scripts.bootstrap
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sma-database
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Platform Administrator
      - key: DEMO_MODE
        value: "true"
      - key: SYNTHETIC_DEMO_MODE
        value: "true"
      - key: DEV_INLINE_TASKS
        value: "true"
      - key: USE_REAL_NLP
        value: "false"
      - key: CORS_ORIGINS
        value: '["http://localhost:3000"]'

  - type: web
    name: sma-dashboard
    runtime: docker
    region: singapore
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: sma-api
          property: hostport

databases:
  - name: sma-database
    region: singapore
    plan: free
    databaseName: sma
    user: sma
    ipAllowList: []
